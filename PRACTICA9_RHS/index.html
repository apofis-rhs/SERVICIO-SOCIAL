<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/styles/handsontable.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/styles/ht-theme-main.min.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>Document</title>
</head>
<body>
    <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
    <label style="font-weight: bold;">Buscar:</label>
    <input id="buscador_agenda" type="text" placeholder="ID, Nombre o Teléfono..." 
           style="padding: 8px; width: 300px; border: 1px solid #ccc; border-radius: 4px;">
</div>
<style>
    
    .handsontable .htSearchResult {
        background-color: #c296e9 !important; /* Tu azul */
        color: #ffffff !important;           /* Texto blanco suele verse mejor con ese azul */
        font-weight: bold !important;
        box-shadow: inset 0 0 0 1px #2a7fb3; /* Un borde interno azul oscuro para resaltar */
    }

  
    .htCenter {
        text-align: center !important;
    }

    /* Fondo oscuro translúcido */
.modal-overlay {
    display: none; 
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
}

/* Caja blanca central */
.modal-content {
    background-color: #fff;
    margin: 10% auto;
    padding: 0;
    border-radius: 8px;
    width: 60%;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    font-family: Arial, sans-serif;
}

.modal-header {
    padding: 15px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h3 { margin: 0; color: #333; }

.close-btn {
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    color: #aaa;
}

.close-btn:hover { color: #000; }

.modal-body {
    padding: 20px;
    max-height: 400px;
    overflow-y: auto; /* Scroll si el historial es largo */
}

.modal-footer {
    padding: 15px;
    border-top: 1px solid #eee;
    text-align: right;
}

.btn-cerrar {
    background-color: #c296e9;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
}

.btn-cerrar:hover { background-color: #a17bc9; }

/* Estilo para la tabla de historial interna */
.modal-body table {
    width: 100%;
    border-collapse: collapse;
}

.modal-body th, .modal-body td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
}

.modal-body tr:nth-child(even) { background-color: #f9f9f9; }
</style>

    <div id="handsometable"></div>

    <div id="modalHistorial" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Historial de Movimientos 🕒</h3>
            <span class="close-btn" onclick="document.getElementById('modalHistorial').style.display='none'">&times;</span>
        </div>
        <div id="contenidoHistorial" class="modal-body">
            </div>
        <div class="modal-footer">
            <button class="btn-cerrar" onclick="document.getElementById('modalHistorial').style.display='none'">Cerrar</button>
        </div>
    </div>
</div>


    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
    <script src="handsome.js"></script>
</body>
</html>
